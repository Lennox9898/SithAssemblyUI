name: Check and build website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Upload website files (also suitable for normal hosting)
        uses: actions/upload-artifact@v4
        with:
          name: sith-assembly-webhosting
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
