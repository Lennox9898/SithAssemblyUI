# IONOS workflow with project-specific validation and restricted secret access.
# More information under https://docs.ionos.space/docs/github-actions-customization/
# version: 2022-07-21

name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: ionos-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      PROJECT_ID: ${{ inputs.project-id }}
      BRANCH_ID: ${{ inputs.branch-id }}
      VERSION: ${{ inputs.version }}
      DEPLOYMENT_ID: ${{ matrix.deployment-id }}
    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate deployment identifiers
        run: node scripts/deployment.mjs validate

      - name: Update deployment status
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@184a369b679287c06ff3d4392cf57bf0fd32656e # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@f90800cda6ff05947f58f27d6f9178c7bbd5180e # v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          # This website has no secret-backed runtime templates. Keep repository
          # secrets scoped to the IONOS API/SSH steps that actually need them.
          data: "[${{ steps.deployment.outputs.template-variables }}]"
          input-directory: deployment
          output-directory: deployment
          intermediate-data-file: deployment/.template-renderer-data

      - name: Prepare deployment without shell interpolation
        env:
          SITE_URL: ${{ fromJson(steps.deployment.outputs.info).site-url }}
        run: node scripts/deployment.mjs prepare

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@452884710a8fec9421c32d6c8ab2c69566703b02 # v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      - name: Update deployment status
        if: ${{ always() && steps.deployment.outcome == 'success' }}
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
